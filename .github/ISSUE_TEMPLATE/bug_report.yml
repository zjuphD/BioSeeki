name: "Bug report / 问题反馈"
description: "Report a reproducible problem with BioSeeki. / 反馈可复现的使用问题。"
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "This issue is public. Use anonymized examples; do not upload passwords, tokens, or unpublished research data. / 此页面公开可见，请使用脱敏示例。"
  - type: input
    id: version
    attributes:
      label: "App version / 应用版本"
      placeholder: "e.g. Beta 0.1.3"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: "System / 系统"
      placeholder: "e.g. macOS 15, Apple silicon"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce / 复现步骤"
      description: "Where did you start, and what did you click or ask? / 从哪个页面开始，点击或输入了什么？"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: "Expected and actual behavior / 预期与实际结果"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Optional screenshot or short log / 截图或简短日志（可选）"
      description: "Remove account details, credentials, and private research content first. / 请先移除账号、密钥和课题隐私内容。"
